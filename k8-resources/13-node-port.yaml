kind: Service
apiVersion: v1
metadata:
  name: nginx-np
spec:
  type: NodePort
  selector:
    project: aws
    environment: dev
    component: backend 
    demo: np
  ports:
   - protocol: TCP
     port: 80 # service port
     targetPort: 80   # container port


---

kind: Pod
apiVersion: v1
metadata:
 name: backend-np
 labels:
  project: aws
  environment: dev
  component: backend 
  demo: np
spec:
 containers:
  - name: nginx
    image: nginx

  