kind: Service
apiVersion: v1
metadata:
  name: nginx-lb
spec:
  type: LoadBalancer
  selector:
    project: aws
    environment: dev
    component: backend 
    demo: lb
  ports:
   - protocol: TCP
     port: 80 # service port
     targetPort: 80   # container port


---

kind: Pod
apiVersion: v1
metadata:
 name: backend-lb
 labels:
  project: aws
  environment: dev
  component: backend 
  demo: lb
spec:
 containers:
  - name: nginx
    image: nginx

  